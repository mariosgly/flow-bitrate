[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-bitrate"
version = "0.1.0"
description = "FlowDec rate/computation diagnostics and bitrate allocation"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.7.1",
  "torchaudio==2.7.1",
  "pytorch-lightning==2.5.5",
  "torchmetrics==1.8.2",
  "wandb==0.19.11",
  "numpy==1.26.4",
  "scipy==1.12.0",
  "soundfile==0.13.1",
  "einops==0.8.0",
  "omegaconf==2.3.0",
  "PyYAML==6.0.2",
  "descript-audio-codec==1.0.0",
  "librosa==0.10.2.post1",
  "numba==0.61.2",
  "setuptools==80.9.0",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools]
packages = ["flow_bitrate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "/scratch/mg8253/flow-bitrate/cache/pytest"
